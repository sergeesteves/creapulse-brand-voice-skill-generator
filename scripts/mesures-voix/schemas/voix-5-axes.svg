<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 720 512' role='img' aria-labelledby='va-t va-d' font-family='Open Sans, system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif'><title id='va-t'>De quoi une voix de marque est faite</title><desc id='va-d'>Cinq axes d'une voix de marque, avec pour chacun ce qui se compte et la valeur relevée sur les 18 articles publiés de Serge Esteves. Ton : 245 vous et aucun tu. Style de phrase : une incise tous les 470 mots. Vocabulaire : mécanique 8 fois. Déroulé : 82 pour cent de paragraphes autonomes. Principes édito : aucun tiret cadratin sur 50 711 mots.</desc><rect x='0.5' y='0.5' width='719' height='511' fill='#f7f7f7' stroke='#000000' stroke-opacity='0.12'/><text x='32' y='44' font-size='21' font-weight='700' fill='#111111'>De quoi une voix de marque est faite</text><text x='32' y='68' font-size='14' fill='#76797d'>Cinq axes, et ce qui se compte dans chacun</text><text x='50' y='100' font-size='12' font-weight='600' fill='#76797d' letter-spacing='0.6'>AXE ET CE QUI SE COMPTE</text><text x='420' y='100' font-size='12' font-weight='600' fill='#76797d' letter-spacing='0.6'>RELEVÉ SUR 18 ARTICLES</text><rect x='32' y='114' width='656' height='66' fill='#ffffff'/><rect x='32' y='114' width='4' height='66' fill='#029ae5'/><text x='50' y='142' font-size='15' font-weight='700' fill='#111111'>Ton</text><text x='50' y='164' font-size='13' fill='#76797d'>Les pronoms d'adresse</text><text x='420' y='142' font-size='15' font-weight='700' fill='#111111'>245 « vous »</text><text x='420' y='164' font-size='13' fill='#76797d'>et pas un seul « tu »</text><rect x='32' y='188' width='656' height='66' fill='#ffffff'/><rect x='32' y='188' width='4' height='66' fill='#e61781'/><text x='50' y='216' font-size='15' font-weight='700' fill='#111111'>Style de phrase</text><text x='50' y='238' font-size='13' fill='#76797d'>La fréquence des incises</text><text x='420' y='216' font-size='15' font-weight='700' fill='#111111'>1 incise tous les 470 mots</text><text x='420' y='238' font-size='13' fill='#76797d'>« D'ailleurs » en tête, 36 fois</text><rect x='32' y='262' width='656' height='66' fill='#ffffff'/><rect x='32' y='262' width='4' height='66' fill='#029ae5'/><text x='50' y='290' font-size='15' font-weight='700' fill='#111111'>Vocabulaire</text><text x='50' y='312' font-size='13' fill='#76797d'>Les marqueurs rares</text><text x='420' y='290' font-size='15' font-weight='700' fill='#111111'>« mécanique » 8 fois</text><text x='420' y='312' font-size='13' fill='#76797d'>moins d'une fois par article</text><rect x='32' y='336' width='656' height='66' fill='#ffffff'/><rect x='32' y='336' width='4' height='66' fill='#029ae5'/><text x='50' y='364' font-size='15' font-weight='700' fill='#111111'>Déroulé</text><text x='50' y='386' font-size='13' fill='#76797d'>Les paragraphes qui tiennent seuls</text><text x='420' y='364' font-size='15' font-weight='700' fill='#111111'>82 % autonomes</text><text x='420' y='386' font-size='13' fill='#76797d'>409 paragraphes sur 498</text><rect x='32' y='410' width='656' height='66' fill='#ffffff'/><rect x='32' y='410' width='4' height='66' fill='#029ae5'/><text x='50' y='438' font-size='15' font-weight='700' fill='#111111'>Principes édito</text><text x='50' y='460' font-size='13' fill='#76797d'>Ce qui n'apparaît jamais</text><text x='420' y='438' font-size='15' font-weight='700' fill='#111111'>0 tiret cadratin</text><text x='420' y='460' font-size='13' fill='#76797d'>sur 50 711 mots</text><text x='32' y='500' font-size='12' fill='#76797d'>Relevé par script sur les 18 articles publiés, en octobre 2026.</text></svg>
