<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 720 512' role='img' aria-labelledby='vt-t vt-d' font-family='Open Sans, system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif'><title id='vt-t'>Pourquoi un trait de voix devient un tic</title><desc id='vt-d'>Une consigne nomme un trait de voix. Sans sa fréquence, le modèle rend le trait visible pour prouver qu'il a obéi, le place à chaque section, et le trait devient un tic. Avec sa fréquence, le modèle le place une fois et le trait reste une voix.</desc><defs><marker id='vt-fl' viewBox='0 0 8 8' refX='4' refY='4' markerWidth='7' markerHeight='7' orient='auto'><path d='M0 0 L8 4 L0 8 z' fill='#029ae5'/></marker></defs><rect x='0.5' y='0.5' width='719' height='511' fill='#f7f7f7' stroke='#000000' stroke-opacity='0.12'/><text x='32' y='44' font-size='21' font-weight='700' fill='#111111'>Pourquoi un trait de voix devient un tic</text><text x='32' y='68' font-size='14' fill='#76797d'>Le même trait, selon que la consigne dit sa fréquence ou non</text><rect x='200' y='90' width='320' height='52' rx='6' fill='#ffffff' stroke='#029ae5'/><text x='360' y='112' font-size='14' font-weight='700' fill='#111111' text-anchor='middle'>La consigne nomme un trait</text><text x='360' y='131' font-size='12.5' fill='#76797d' text-anchor='middle'>« Employez : mécanique, déséquilibre »</text><path d='M360 142 L360 166' stroke='#029ae5' fill='none'/><path d='M190 166 L530 166' stroke='#029ae5' fill='none'/><path d='M190 166 L190 196' stroke='#029ae5' fill='none' marker-end='url(#vt-fl)'/><path d='M530 166 L530 196' stroke='#029ae5' fill='none' marker-end='url(#vt-fl)'/><rect x='40' y='204' width='300' height='44' rx='6' fill='#ffffff' stroke='#000000' stroke-opacity='0.12'/><text x='190' y='231' font-size='14' font-weight='700' fill='#111111' text-anchor='middle'>Sans sa fréquence</text><path d='M190 248 L190 278' stroke='#029ae5' fill='none' marker-end='url(#vt-fl)'/><rect x='40' y='286' width='300' height='76' rx='6' fill='#ffffff' stroke='#000000' stroke-opacity='0.12'/><text x='190' y='310' font-size='13' fill='#111111' text-anchor='middle'>Le modèle rend le trait visible</text><text x='190' y='328' font-size='13' fill='#111111' text-anchor='middle'>pour prouver qu'il a obéi, donc</text><text x='190' y='346' font-size='13' fill='#111111' text-anchor='middle'>le place à chaque section</text><path d='M190 362 L190 390' stroke='#029ae5' fill='none' marker-end='url(#vt-fl)'/><rect x='40' y='398' width='300' height='46' rx='6' fill='#e61781'/><text x='190' y='427' font-size='15' font-weight='700' fill='#111111' text-anchor='middle'>Un tic</text><rect x='380' y='204' width='300' height='44' rx='6' fill='#ffffff' stroke='#000000' stroke-opacity='0.12'/><text x='530' y='231' font-size='14' font-weight='700' fill='#111111' text-anchor='middle'>Avec sa fréquence</text><path d='M530 248 L530 278' stroke='#029ae5' fill='none' marker-end='url(#vt-fl)'/><rect x='380' y='286' width='300' height='76' rx='6' fill='#ffffff' stroke='#000000' stroke-opacity='0.12'/><text x='530' y='319' font-size='13' fill='#111111' text-anchor='middle'>Le modèle le place une fois,</text><text x='530' y='337' font-size='13' fill='#111111' text-anchor='middle'>comme la consigne l'indique</text><path d='M530 362 L530 390' stroke='#029ae5' fill='none' marker-end='url(#vt-fl)'/><rect x='380' y='398' width='300' height='46' rx='6' fill='#027dba'/><text x='530' y='427' font-size='15' font-weight='700' fill='#ffffff' text-anchor='middle'>Une voix</text><text x='32' y='480' font-size='12' fill='#76797d'>Dans les 18 articles publiés de Serge Esteves, « mécanique » apparaît 8 fois,</text><text x='32' y='498' font-size='12' fill='#76797d'>soit moins d'une fois par article. Relevé en octobre 2026.</text></svg>
