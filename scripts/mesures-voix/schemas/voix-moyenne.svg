<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 720 432' role='img' aria-labelledby='vm-t vm-d' font-family='Open Sans, system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif'><title id='vm-t'>La moyenne n'a la voix de personne</title><desc id='vm-d'>Schéma de principe, sans échelle. Une courbe en cloche représente tous les textes qu'un modèle a lus. À son sommet, là où se trouvent la plupart des contenus, le texte que le modèle écrit par défaut : propre, interchangeable. Loin dans la queue de la courbe, la voix de l'auteur, ce qui s'écarte de la moyenne : une façon de trancher, un mot inattendu, un rythme.</desc><rect x='0.5' y='0.5' width='719' height='431' fill='#f7f7f7' stroke='#000000' stroke-opacity='0.12'/><text x='32' y='44' font-size='21' font-weight='700' fill='#111111'>La moyenne n'a la voix de personne</text><text x='32' y='68' font-size='14' fill='#76797d'>Ce qu'un modèle écrit sans indication, et ce qui se remarque</text><text x='300' y='166' font-size='14' fill='#111111' text-anchor='middle'><tspan font-weight='700'>Par défaut</tspan> : un texte propre, interchangeable</text><path d='M52.0 326.6 L57.1 326.1 L62.3 325.4 L67.4 324.7 L72.5 323.8 L77.7 322.9 L82.8 321.8 L87.9 320.7 L93.1 319.3 L98.2 317.9 L103.3 316.2 L108.5 314.4 L113.6 312.4 L118.7 310.3 L123.9 307.9 L129.0 305.3 L134.1 302.5 L139.3 299.6 L144.4 296.3 L149.5 292.9 L154.7 289.3 L159.8 285.4 L164.9 281.4 L170.1 277.1 L175.2 272.6 L180.3 268.0 L185.5 263.3 L190.6 258.3 L195.7 253.3 L200.9 248.2 L206.0 243.1 L211.1 237.9 L216.3 232.7 L221.4 227.6 L226.5 222.5 L231.7 217.6 L236.8 212.8 L241.9 208.2 L247.1 203.8 L252.2 199.7 L257.3 195.9 L262.5 192.5 L267.6 189.4 L272.7 186.7 L277.9 184.5 L283.0 182.7 L288.1 181.3 L293.3 180.4 L298.4 180.0 L303.5 180.1 L308.7 180.7 L313.8 181.8 L318.9 183.3 L324.1 185.3 L329.2 187.7 L334.3 190.5 L339.5 193.8 L344.6 197.3 L349.7 201.2 L354.9 205.4 L360.0 209.9 L365.1 214.6 L370.3 219.4 L375.4 224.4 L380.5 229.5 L385.7 234.6 L390.8 239.8 L395.9 245.0 L401.1 250.2 L406.2 255.2 L411.3 260.2 L416.5 265.1 L421.6 269.8 L426.7 274.3 L431.9 278.7 L437.0 282.9 L442.1 286.9 L447.3 290.7 L452.4 294.2 L457.5 297.6 L462.7 300.7 L467.8 303.6 L472.9 306.3 L478.1 308.8 L483.2 311.1 L488.3 313.2 L493.5 315.1 L498.6 316.9 L503.7 318.4 L508.9 319.8 L514.0 321.1 L519.1 322.3 L524.3 323.3 L529.4 324.2 L534.5 325.0 L539.7 325.7 L544.8 326.3 L549.9 326.8 L555.1 327.3 L560.2 327.7 L565.3 328.1 L570.5 328.4 L575.6 328.6 L580.7 328.8 L585.9 329.0 L591.0 329.2 L596.1 329.3 L601.3 329.4 L606.4 329.5 L611.5 329.6 L616.7 329.7 L621.8 329.7 L626.9 329.8 L632.1 329.8 L637.2 329.9 L642.3 329.9 L647.5 329.9 L652.6 329.9 L657.7 329.9 L662.9 330.0 L668.0 330.0' fill='none' stroke='#029ae5' stroke-width='2.5' stroke-linejoin='round'/><text x='300' y='296' font-size='13' fill='#111111' text-anchor='middle'>La plupart des contenus</text><line x1='52' y1='330' x2='668' y2='330' stroke='#000000' stroke-opacity='0.25'/><path d='M560 318 L560 264' stroke='#e61781' fill='none'/><circle cx='560' cy='327.7' r='7' fill='#e61781'/><text x='484' y='196' font-size='15' font-weight='700' fill='#111111'>Votre voix</text><text x='484' y='216' font-size='13' fill='#76797d'>ce qui s'écarte de la moyenne :</text><text x='484' y='234' font-size='13' fill='#76797d'>une façon de trancher, un mot</text><text x='484' y='252' font-size='13' fill='#76797d'>inattendu, un rythme</text><text x='360' y='358' font-size='13' fill='#76797d' text-anchor='middle'>Tous les textes que le modèle a lus, du plus courant au plus singulier</text><text x='32' y='414' font-size='12' fill='#76797d'>Schéma de principe, sans échelle.</text></svg>